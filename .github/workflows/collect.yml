name: Collect observations
# Weekly evidence refresh. Observations are generated data; this workflow never edits content/.
# main takes changes only through a pull request with passing checks, and work done with
# GITHUB_TOKEN starts no other workflow on its own. So the job opens its own pull request,
# dispatches the checks on it, merges it when they pass, and dispatches the deploy on main.
# GitHub does not link a dispatched run's checks to a pull request, so once each required job has
# passed on the branch's exact commit, the job copies that result onto the commit as a status the
# pull request can see. Approved by Jamie on 2026-10-18. A run closes any collection pull request an
# earlier run left open (its checks failed or it could not merge): the new run observes from main, so it
# carries the same evidence and more.
on:
  schedule:
    - cron: '17 11 * * 1' # Mondays, 11:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: collect-observations
  cancel-in-progress: false
jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Observe sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TINYLYTICS_API_KEY: ${{ secrets.TINYLYTICS_API_KEY }} # read-only key; without it Tinylytics is skipped
        # A source that cannot be read keeps its previous evidence and fails this step, which the run
        # tolerates; the job summary lists what failed so a broken source is visible.
        run: |
          set -o pipefail
          npm run collect 2>&1 | tee "$RUNNER_TEMP/collect.log"
        continue-on-error: true
      - name: Summarize
        if: always()
        run: |
          {
            echo '### Collection'
            echo
            echo '```'
            grep -E 'written,|^  ' "$RUNNER_TEMP/collect.log" || echo 'The collector did not finish.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm test
      - name: Open, check, merge and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("collect/")) | .number' |
            while read -r stale; do
              gh pr close "$stale" --delete-branch \
                --comment "Superseded by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, which observes from main."
            done
          git add data/observations
          if git diff --cached --quiet; then
            echo "No new evidence."
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          branch="collect/$day-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Collect observations $day"
          git push -u origin "$branch"
          sha="$(git rev-parse HEAD)"
          gh pr create --base main --head "$branch" --title "Collect observations $day" \
            --body "Weekly evidence refresh from run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Merged automatically when the checks pass."
          gh workflow run ci.yml --ref "$branch"
          run=""
          for _ in $(seq 30); do
            sleep 10
            run="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -1)"
            [ -n "$run" ] && break
          done
          test -n "$run"
          gh run watch "$run" --interval 30 --exit-status
          for check in Quality Browser CodeQL; do
            test "$(gh run view "$run" --json jobs --jq ".jobs[] | select(.name == \"$check\") | .conclusion")" = success
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context="$check" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" \
              -f description="Passed in the dispatched CI run on this commit" >/dev/null
          done
          for attempt in $(seq 12); do
            gh pr merge "$branch" --squash --delete-branch && break
            test "$attempt" -lt 12
            sleep 10
          done
          gh workflow run ci.yml --ref main
