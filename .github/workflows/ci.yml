name: CI and deploy
on:
  push:
    branches: [main]
  # The weekly collection opens pull requests that change only data/observations, with the workflow's own
  # token. GitHub will not run this workflow for them; it recorded a failed run with no jobs on every one.
  # collect.yml dispatches these checks on the branch instead, so such pull requests skip this trigger.
  pull_request:
    paths-ignore:
      - 'data/observations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap dates pages by their git history (collection/lastmod.ts)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The smaller copies of the pictures (collection/image-files.ts) are named by their source's bytes and the
      # recipe, so copies kept from an earlier run are never stale. The deploy job makes its own from the sources.
      - name: Restore picture copies from earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: images-${{ hashFiles('collection/images.ts', 'content/artifacts/**', 'data/observations/screenshot/**') }}
          restore-keys: images-
      - run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run templates
      - name: Validate infrastructure schemas
        run: |
          pipx run --spec cfn-lint==1.57.2 cfn-lint infra/generated/*.json
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap dates pages by their git history (collection/lastmod.ts)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The smaller copies of the pictures (collection/image-files.ts) are named by their source's bytes and the
      # recipe, so copies kept from an earlier run are never stale. The deploy job makes its own from the sources.
      - name: Restore picture copies from earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: images-${{ hashFiles('collection/images.ts', 'content/artifacts/**', 'data/observations/screenshot/**') }}
          restore-keys: images-
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
  deploy:
    name: Deploy
    needs: [quality, browser, codeql]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sitemap dates pages by their git history (collection/lastmod.ts)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - run: npm run templates
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Check current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/jthingelstad/thingelstad.xyz/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - run: npm run deploy
